# Linglong EEF training from an immutable published TOS dataset.
defaults:
  - train_linglong_0923_1010_1012_1017_fittings_eef_gtstate_8gpu
  - _self_

dataloader:
  dataset_dir: ${oc.env:LINGLONG_TOS_DATASET}
  normalization_dataset_dir: ${dataloader.dataset_dir}
  eval_dataset_dir: null
  cache_dir: ${oc.env:OPENWAM_TOS_CACHE_DIR,/tmp/openwam-tos-cache}
  cache_max_bytes: 4294967296  # 4 GiB per node, shared by all ranks/workers
  cache_min_free_bytes: 1073741824
  window_stride: 1  # Match the local Linglong Base recipe.

training:
  batch_size: 6
  gradient_accumulation_steps: 24
  output_path: outputs/linglong_tos
  save_trainable_only: true
  save_full_states_for_resume: true
  checkpoint_base_path: /vePFS/tangyuting/OpenWAM/assets/openwam_ckpt/openwam_alpha/OpenWAM-Alpha-Pretrain-Foundation-Model/checkpoint_step_154000.safetensors
  checkpoint_base_url: https://huggingface.co/OpenWAM/OpenWAM-Alpha-Pretrain-Foundation-Model/resolve/main/checkpoint_step_154000.safetensors
  checkpoint_base_sha256: 8d7d3a1f1e5ce46d58d676c71315d3950007dad242676b43236bef6c4396c0b1
  keep_last_k_ckpts: 1

project:
  output_dir: ${training.output_path}/hydra
  wandb:
    project: null
