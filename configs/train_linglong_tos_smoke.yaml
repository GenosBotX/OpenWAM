defaults:
  - train_linglong_tos
  - _self_

# Validate the real TOS -> model -> optimizer path on two 80 GB GPUs.
# Full video/action fine-tuning uses train_linglong_tos, without this freeze.
model:
  freeze:
    - video_backbone

training:
  batch_size: 1
  gradient_accumulation_steps: 1
  num_epochs: null
  max_steps: 1
  dataset_num_workers: 2
  save_steps: 0
  output_path: outputs/linglong_tos_smoke
  offload_optimizer_device: none
  optimizer_foreach: false

dataloader:
  cache_dir: ${oc.env:OPENWAM_TOS_CACHE_DIR,/tmp/openwam-tos-smoke}
  cache_max_bytes: 8388608  # Deliberately small to exercise eviction
  cache_min_free_bytes: 1073741824
