model:
  action_backbone:
    dim: 1024
    ffn_dim: 4096
    shift_action: 5.0
  architecture:
    action_dim: 80
    attention_mask_mode: mutual
    bridge_interval: 1
    bridge_layers: null
    detach_bridge: false
    framework: dual_system
    idm_video_cond_noise_prob: 0.5
    mot_checkpoint_mixed_attn: true
    state_dim: 80
    use_proprioception: true
    variant: joint_self_attn
    video_attention_mask_mode: first_frame_causal
  freeze:
  - video_backbone.text_encoder
  - video_backbone.reason1
  - video_backbone.vae
  - video_backbone.image_encoder
  - video_backbone.video_encoder
  video_backbone:
    components:
    - attr: dit
      extra_kwargs:
        dim: 3072
        eps: 1.0e-06
        ffn_dim: 14336
        freq_dim: 256
        fuse_vae_embedding_in_latents: true
        has_image_input: false
        in_dim: 48
        num_heads: 24
        num_layers: 30
        out_dim: 48
        patch_size:
        - 1
        - 2
        - 2
        require_clip_embedding: false
        require_vae_embedding: false
        seperated_timestep: true
        text_dim: 4096
      model_class: openwam.model.video_backbone.wan.models.dit.WanModel
    - attr: vae
      extra_kwargs: {}
      model_class: openwam.model.video_backbone.wan.models.vae.WanVideoVAE38
    - attr: text_encoder
      extra_kwargs: {}
      model_class: openwam.model.video_backbone.wan.models.text_encoder.WanTextEncoder
    encoder:
      model_path: /vePFS/tangyuting/models/Wan2.2-TI2V-5B
      name: wan22_vae
    from_scratch: false
    model_path: /vePFS/tangyuting/models/Wan2.2-TI2V-5B
    name: wan22_ti2v_5b
    shift_video: 5.0
    tokenizer:
      attr: tokenizer
      class: openwam.model.video_backbone.wan.models.text_encoder.HuggingfaceTokenizer
      kwargs:
        clean: whitespace
        seq_len: 512
      path_kwarg: name
      subdir: tokenizer/google/umt5-xxl
project:
  name: openwam
  output_dir: ${training.output_path}/hydra
  seed: 42
  wandb:
    entity: null
    project: null
    run_name: null
