# The inherited Wan config contains a placeholder path.  Keep both entries
# explicit because the native VAE encoder is configured separately from DiT.
model:
  video_backbone:
    model_path: ${oc.env:OPENWAM_WAN_MODEL_DIR,/home/ma-user/work/customer-test/OpenWAM-main/assets/video_backbone_ckpt/Wan2.2-TI2V-5B}
    encoder:
      model_path: ${oc.env:OPENWAM_WAN_MODEL_DIR,/home/ma-user/work/customer-test/OpenWAM-main/assets/video_backbone_ckpt/Wan2.2-TI2V-5B}

dataloader:
  dataset_dir:
    - ${oc.env:OPENWAM_DATA_ROOT}/20261022_eef_v1/train
    - ${oc.env:OPENWAM_DATA_ROOT}/20261023_eef_v1/train
    - ${oc.env:OPENWAM_DATA_ROOT}/20261024_eef_v1/train
